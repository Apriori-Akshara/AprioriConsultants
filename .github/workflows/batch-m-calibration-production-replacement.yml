name: Batch M authorized calibration production replacement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-replacement-and-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Execute authorized replacement and post-replacement gates
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMCalibrationProductionReplacement.js

      - name: Upload production replacement verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-calibration-production-replacement-2026-09-17
          path: artifacts/batch-m-calibration-production-replacement/
          if-no-files-found: error
          retention-days: 30
