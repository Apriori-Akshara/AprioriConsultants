name: Batch M controlled replacement validation v4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch-m-calibration-controlled-replacement-validation-v4.yml'
      - 'scripts/runBatchMCalibrationCandidateSelection.js'
      - 'scripts/transformBatchMCalibrationCandidatesForPromptUniqueness.js'
      - 'scripts/reviewBatchMCalibrationCandidates.js'
      - 'scripts/runBatchMCalibrationControlledReplacementValidationV4.js'
      - 'scripts/batchMExtensionlessModuleLoader.mjs'
      - 'scripts/batchMExtensionlessResolve.mjs'
      - 'src/data/sat/mockContent/batchMProductionStore.js'
      - 'src/data/sat/mockContent/batchMProductionController.js'
      - 'src/data/sat/mockContent/batchMFinalCorpusGate.js'
      - 'src/data/sat/mockContent/batchMCrossCorpusCalibration.js'
      - 'src/data/sat/mockContent/batchMCrossCorpusCalibrationCanonical.js'
      - 'src/data/sat/mockContent/batchMContentQualityGate.js'
      - 'src/data/sat/mockContent/batchMRemediationBlueprint.js'
      - 'src/data/sat/mockContent/verbalConstructionRemediated.js'
      - 'src/data/sat/mockContent/mathBankFactoryRemediated.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-replacement-validation-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate approved 352-candidate scope
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMCalibrationCandidateSelection.js
      - name: Apply controlled prompt-context transformation and rerun quality gate
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/transformBatchMCalibrationCandidatesForPromptUniqueness.js
      - name: Independently review transformed candidate package
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/reviewBatchMCalibrationCandidates.js
      - name: Validate complete 352-question replacement in memory
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMCalibrationControlledReplacementValidationV4.js
      - name: Upload controlled replacement validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-calibration-controlled-replacement-validation-v4-2026-09-17
          path: |
            artifacts/batch-m-calibration-candidate-selection/
            artifacts/batch-m-calibration-candidate-review/
            artifacts/batch-m-calibration-controlled-replacement-validation/
          if-no-files-found: error
          retention-days: 30
