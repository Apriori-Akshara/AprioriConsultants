name: Batch M SAT/PSAT Public Route Smoke Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/verifyBatchMSATSeriesBPublicRoutes.mjs'
      - '.github/workflows/batch-m-sat11-sat20-public-route-smoke.yml'
      - 'src/pages/SATMocksSeriesB/index.js'
      - 'src/pages/PSATMocks/index.js'
      - 'src/pages/SATMocks/[testId].js'
      - 'src/lib/sat/satAccess.js'
      - 'src/lib/sat/satLogin.js'

permissions:
  contents: read

jobs:
  verify-sat-psat-public-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Verify live SAT/PSAT mock routes
        env:
          BATCH_M_PUBLIC_BASE_URL: https://www.aprioriconsultants.org
        run: node scripts/verifyBatchMSATSeriesBPublicRoutes.mjs
