name: Batch M controlled replacement package validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-m-deep-content-quality-replacement-package.yml'
      - 'scripts/runBatchMDeepContentQualityReplacementPackage.mjs'
      - 'src/data/sat/mockContent/batchMProductionStore.js'
      - 'src/data/sat/mockContent/batchMProductionController.js'
      - 'src/data/sat/mockContent/batchMContentQualityGate.js'
      - 'src/data/sat/questionSchema.js'

permissions:
  contents: read
  actions: read

jobs:
  replacement-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download current 25-candidate selection
        uses: actions/download-artifact@v4
        with:
          name: batch-m-current-deep-content-quality-candidate-selection
          path: artifacts/batch-m-current-deep-content-quality-candidate-selection
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35666673409

      - name: Download current 25-candidate independent review
        uses: actions/download-artifact@v4
        with:
          name: batch-m-deep-content-quality-independent-review
          path: artifacts/batch-m-deep-content-quality-independent-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35666673400

      - name: Prepare and validate controlled replacement package
        env:
          BATCH_M_REPLACEMENT_PACKAGE_CANDIDATE_INPUT: artifacts/batch-m-current-deep-content-quality-candidate-selection/BATCH-M-DEEP-CONTENT-QUALITY-CANDIDATE-SELECTION-2026-09-17.json
          BATCH_M_REPLACEMENT_PACKAGE_REVIEW_INPUT: artifacts/batch-m-deep-content-quality-independent-review/BATCH-M-DEEP-CONTENT-QUALITY-INDEPENDENT-REVIEW-2026-09-17.json
        run: node scripts/runBatchMDeepContentQualityReplacementPackage.mjs

      - name: Upload controlled replacement package
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-deep-content-quality-replacement-package
          path: artifacts/batch-m-deep-content-quality-replacement-package/
          if-no-files-found: error
          retention-days: 30

# Candidate-only package preparation. This workflow never authorizes or performs production replacement.
