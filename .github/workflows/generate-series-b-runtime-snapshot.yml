name: Generate Series B runtime snapshot

on:
  push:
    branches:
      - batchm-runtime-snapshot
    paths-ignore:
      - src/data/sat/mockContent/batchMSeriesBRuntimeSnapshot.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Series B snapshot
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs ./scripts/generateBatchMSeriesBRuntimeSnapshot.mjs

      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sat/mockContent/batchMSeriesBRuntimeSnapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "chore: materialize Series B runtime corpus"
          git push origin HEAD:batchm-runtime-snapshot
