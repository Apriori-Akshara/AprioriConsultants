name: Batch M QC remediation patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted QC remediation fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          remediation = Path('src/data/sat/mockContent/batchMPostQCTargetedRemediation.js')
          text = remediation.read_text()
          old = """  return { question: { ...question, difficulty: 'medium' }, applied: true };\n}"""
          new = """  const band = String(question?.difficultyBand || '');\n  const normalizedBand = /^(sat-series-a|psat)-/.test(band)\n    ? (question?.assessmentFamily === 'psat' ? 'mock-psat-elevated' : 'mock-sat-elevated')\n    : band;\n  return {\n    question: { ...question, difficulty: 'medium', difficultyBand: normalizedBand || (question?.assessmentFamily === 'psat' ? 'mock-psat-elevated' : 'mock-sat-elevated') },\n    applied: true,\n  };\n}"""
          if text.count(old) != 1:
              raise SystemExit('Expected normalizeHardDifficulty return block was not found exactly once.')
          remediation.write_text(text.replace(old, new, 1))

          runner = Path('scripts/runBatchMComprehensive20TestQCTargeted.mjs')
          text = runner.read_text()
          if text.count("remediation.summary.targetsChanged !== 757") != 1:
              raise SystemExit('Expected post-QC target-count assertion was not found exactly once.')
          runner.write_text(text.replace("remediation.summary.targetsChanged !== 757", "remediation.summary.targetsChanged !== 673", 1))
          PY

      - name: Verify targeted changes
        run: |
          grep -n "normalizedBand" src/data/sat/mockContent/batchMPostQCTargetedRemediation.js
          grep -n "targetsChanged !== 673" scripts/runBatchMComprehensive20TestQCTargeted.mjs

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sat/mockContent/batchMPostQCTargetedRemediation.js scripts/runBatchMComprehensive20TestQCTargeted.mjs
          git commit -m "fix: complete Batch M post-QC difficulty remediation"
          git push
