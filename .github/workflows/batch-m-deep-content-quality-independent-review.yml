name: Batch M Deep Content Quality Independent Review

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch-m-deep-content-quality-independent-review.yml'
      - 'scripts/runBatchMDeepContentQualityRemediationCandidates.mjs'
      - 'scripts/runBatchMDeepContentQualityCandidateSelection.mjs'
      - 'scripts/runBatchMDeepContentQualityIndependentReview.mjs'
      - 'src/data/sat/mockContent/batchMRemediationCandidateFactory.js'
      - 'src/data/sat/mockContent/batchMContentQualityGate.js'

permissions:
  contents: read
  actions: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate candidate-only remediation pool
        run: node scripts/runBatchMDeepContentQualityRemediationCandidates.mjs

      - name: Select screened candidates
        run: node scripts/runBatchMDeepContentQualityCandidateSelection.mjs

      - name: Run independent substantive review
        run: node scripts/runBatchMDeepContentQualityIndependentReview.mjs

      - name: Upload candidate pool
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-deep-content-quality-candidate-pool
          path: artifacts/batch-m-deep-content-quality-remediation-candidates/
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate selection
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-deep-content-quality-candidate-selection
          path: artifacts/batch-m-deep-content-quality-candidate-selection/
          if-no-files-found: error
          retention-days: 30

      - name: Upload independent review
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-deep-content-quality-independent-review
          path: artifacts/batch-m-deep-content-quality-independent-review/
          if-no-files-found: error
          retention-days: 30

# Candidate-only review; this workflow never authorizes production replacement.
