name: Materialize frozen legacy question bank

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    if: contains(github.event.head_commit.message, 'Run frozen legacy question-bank export') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run question-bank:export-legacy
      - name: Update Step 1 records
        run: |
          node <<'NODE'
          const fs = require('fs');

          const spec = 'docs/HUMAN-EDITABLE-CANONICAL-QUESTION-BANK-SPEC.md';
          let s = fs.readFileSync(spec, 'utf8');
          s = s.replace(
            'The next step is **only** to materialize the complete frozen 30-mock legacy human-editable document set using:',
            'Step 1 is **complete**: the complete frozen 30-mock legacy human-editable document set has been materialized using:'
          );
          fs.writeFileSync(spec, s);

          const maint = 'docs/QUESTION-BANK-MAINTENANCE.md';
          s = fs.readFileSync(maint, 'utf8');
          s = s.replace(
            '### Step 1 — Full 30-mock legacy document materialization — NEXT',
            '### Step 1 — Full 30-mock legacy document materialization — COMPLETE'
          );
          s = s.replace(
            '### Step 2 — Human review/approval working set',
            '### Step 2 — Human review/approval working set — NEXT'
          );
          s = s.replace(
            '**Batch M production generation, targeted remediation, authorized replacements, final corpus gates, cross-corpus calibration, and public quick-check are complete. The human-editable/canonical bridge is implemented and pilot-verified. The next implementation step is full 30-mock legacy document materialization.**',
            '**Batch M production generation, targeted remediation, authorized replacements, final corpus gates, cross-corpus calibration, and public quick-check are complete. The human-editable/canonical bridge is implemented and pilot-verified. Step 1 full 30-mock legacy document materialization is complete; the next implementation step is Step 2 human review/approval working-set preparation.**'
          );
          fs.writeFileSync(maint, s);
          NODE
      - name: Verify exact frozen export
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(), 'question-banks/legacy-30-mock-corpus');
          const keys = [
            ...Array.from({length:10},(_,i)=>'SAT'+(i+1)),
            ...Array.from({length:10},(_,i)=>'PSAT'+(i+1)),
            ...Array.from({length:10},(_,i)=>'SAT'+(i+11))
          ];
          const files = fs.readdirSync(root).filter(x=>x.endsWith('.md')).sort();
          if (files.length !== 30) throw new Error('Expected 30 Markdown documents, found '+files.length);
          if (files.includes('SAT21.md')) throw new Error('SAT21.md must not exist');
          for (const key of keys) {
            const file = path.join(root, key+'.md');
            if (!fs.existsSync(file)) throw new Error('Missing '+key+'.md');
            const s = fs.readFileSync(file,'utf8');
            if (!s.includes('STATUS: LEGACY')) throw new Error(key+' missing LEGACY status');
            if (!s.includes('QUESTION COUNT: 196')) throw new Error(key+' does not declare 196 questions');
            const n = (s.match(/^### Question:/gm)||[]).length;
            if (n !== 196) throw new Error(key+' contains '+n+' questions');
          }
          console.log('Verified 30 documents / 5,880 questions / LEGACY-only / no SAT21.');
          NODE
      - name: Commit exported corpus and records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/materialize-legacy-question-bank.yml
          git add question-banks/legacy-30-mock-corpus docs/HUMAN-EDITABLE-CANONICAL-QUESTION-BANK-SPEC.md docs/QUESTION-BANK-MAINTENANCE.md .github/workflows/materialize-legacy-question-bank.yml
          git diff --cached --quiet && exit 0
          git commit -m "Run frozen legacy question-bank export"
          git push
