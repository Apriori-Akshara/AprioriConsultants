name: Batch M calibration reconciliation candidate review

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Batch M calibration reconciliation candidates
    types:
      - completed
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-m-calibration-reconciliation-candidate-review.yml'
      - 'scripts/reviewBatchMCalibrationReconciliationCandidates.mjs'
      - 'scripts/normalizeBatchMCalibrationReconciliationReviewInput.mjs'
      - 'src/data/sat/mockContent/batchMContentQualityGate.js'
      - 'src/data/sat/mockContent/batchMProductionStore.js'
      - 'src/data/sat/mockContent/batchMFinalCorpusGate.js'
      - 'src/data/sat/mockContent/batchMCrossCorpusCalibrationCanonical.js'
      - 'src/data/sat/mockContent/batchMCrossCorpusCalibration.js'
      - 'src/data/sat/mockContent/batchMProductionController.js'

permissions:
  contents: read
  actions: read

jobs:
  independent-calibration-reconciliation-review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Identify candidate-generation run
        id: locate-candidates
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow batch-m-calibration-reconciliation-candidates.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo 'No successful Batch M calibration reconciliation candidate-generation run was identified.' >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using candidate-generation run $RUN_ID"

      - name: Download candidate-generation artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts/batch-m-calibration-reconciliation-candidates
          gh run download "${{ steps.locate-candidates.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name batch-m-calibration-reconciliation-candidates \
            --dir artifacts/batch-m-calibration-reconciliation-candidates

      - name: Normalize candidate identity fields for independent reviewer
        run: |
          node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/normalizeBatchMCalibrationReconciliationReviewInput.mjs

      - name: Run independent candidate review
        run: |
          node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/reviewBatchMCalibrationReconciliationCandidates.mjs

      - name: Upload independent review artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-calibration-reconciliation-candidate-review
          path: artifacts/batch-m-calibration-reconciliation-candidate-review/
          if-no-files-found: error
          retention-days: 30
