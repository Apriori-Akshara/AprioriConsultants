name: Batch M calibration remediation scope

# Read-only planning gate: this workflow never mutates the frozen production corpus.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/batch-m-calibration-remediation-scope.yml'
      - 'scripts/runBatchMCrossCorpusCalibrationRemediationPlan.js'
      - 'scripts/batchMExtensionlessModuleLoader.mjs'
      - 'scripts/batchMExtensionlessResolve.mjs'
      - 'src/data/sat/mockContent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-remediation-scope:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute read-only remediation scope
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMCrossCorpusCalibrationRemediationPlan.js
