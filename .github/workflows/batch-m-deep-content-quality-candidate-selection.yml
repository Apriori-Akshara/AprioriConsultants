name: Batch M Deep Content Quality Candidate Selection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/batch-m-deep-content-quality-candidate-selection.yml'
      - 'scripts/runBatchMDeepContentQualityCandidateSelection.mjs'

permissions:
  contents: read
  actions: read

jobs:
  select-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download successful candidate pool
        uses: actions/download-artifact@v4
        with:
          name: batch-m-deep-content-quality-remediation-candidates
          path: artifacts/batch-m-deep-content-quality-remediation-candidates
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35193915000

      - name: Select candidates for independent review
        run: node scripts/runBatchMDeepContentQualityCandidateSelection.mjs

      - name: Upload selection artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-m-deep-content-quality-candidate-selection
          path: artifacts/batch-m-deep-content-quality-candidate-selection/
          if-no-files-found: error
          retention-days: 30
