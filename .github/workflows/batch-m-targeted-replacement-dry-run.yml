name: Batch M targeted replacement dry run

on:
  push:
    paths:
      - 'scripts/runBatchMTargetedReplacementDryRun.js'
      - 'src/data/sat/mockContent/verbalConstructionRemediated.js'
      - 'src/data/sat/mockContent/mathBankFactoryRemediated.js'
      - 'src/data/sat/mockContent/batchMContentQualityGate.js'
      - 'src/data/sat/mockContent/batchMRemediationBlueprint.js'
      - 'package.json'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: node scripts/runBatchMTargetedReplacementDryRun.js
