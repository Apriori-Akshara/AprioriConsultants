name: Batch M targeted candidate selection

on:
  push:
    branches:
      - batch-m-rw-generator-remediation-2026-09-14
    paths-ignore:
      - docs/BATCH-M-TARGETED-CANDIDATE-SELECTION-2026-09-15.json

permissions:
  contents: write

jobs:
  candidate-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: batch-m-rw-generator-remediation-2026-09-14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and select targeted candidates
        run: npm run qc:batch-m-targeted-candidate-selection

      - name: Verify candidate-only boundary
        run: |
          node -e "const r=require('./docs/BATCH-M-TARGETED-CANDIDATE-SELECTION-2026-09-15.json'); if(r.affectedUniqueQuestionCount!==2144) throw new Error('Expected 2144 target records'); if(r.productionMutation!==false) throw new Error('productionMutation must remain false'); if(r.releaseEligible!==false) throw new Error('releaseEligible must remain false'); if(r.replacementAuthorization!=='NOT_AUTHORIZED') throw new Error('replacement authorization must remain NOT_AUTHORIZED'); if(r.sat21Created!==false) throw new Error('SAT21 boundary violated'); console.log('Candidate-selection boundary checks passed.');"

      - name: Record generated candidate-selection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BATCH-M-TARGETED-CANDIDATE-SELECTION-2026-09-15.json
          if git diff --cached --quiet; then
            echo "No generated report changes to commit."
          else
            git commit -m "Record Batch M targeted candidate selection report"
            git push origin HEAD:batch-m-rw-generator-remediation-2026-09-14
          fi
