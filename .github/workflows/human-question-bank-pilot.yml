name: Human question bank pilot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/human-question-bank-pilot.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/validateHumanEditableQuestionBank.mjs'
      - 'scripts/promoteHumanBankToCanonicalStaging.mjs'
      - 'scripts/runHumanQuestionBankPilot.mjs'
      - 'scripts/exportBatchMLegacyCorpusToHumanBank.mjs'
      - 'scripts/humanQuestionBankContentAdapter.mjs'
      - 'scripts/batchMExtensionlessModuleLoader.mjs'
      - 'scripts/batchMExtensionlessResolve.mjs'
      - 'src/data/sat/questionSchema.js'
      - 'src/data/sat/mockContent/**'
      - 'docs/HUMAN-EDITABLE-CANONICAL-QUESTION-BANK-SPEC.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  human-question-bank-pilot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run human-editable to canonical staging pilot
        run: npm run question-bank:pilot
