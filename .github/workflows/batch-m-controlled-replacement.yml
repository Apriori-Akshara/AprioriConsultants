name: Batch M controlled replacement

on:
  push:
    branches:
      - batch-m-controlled-replacement-2026-09-16
    paths:
      - '.batch-m-controlled-replacement-trigger-2026-09-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-replacement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate authoritative Batch M selection with exact payload capture
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMAuthoritativeReplacementSelection.mjs

      - name: Generate and apply controlled replacement
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/applyBatchMControlledReplacementFromAuthoritativeSelection.mjs

      - name: Verify generated replacement state
        run: node --import ./scripts/batchMExtensionlessModuleLoader.mjs scripts/runBatchMControlledReplacementQC.mjs

      - name: Commit controlled replacement artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BATCH-M-TARGETED-CANDIDATE-SELECTION-2026-09-15.json docs/BATCH-M-AUTHORITATIVE-CANDIDATE-SELECTION-2026-09-16.json docs/BATCH-M-CONTROLLED-REPLACEMENT-2026-09-16.json scripts/runBatchMControlledReplacementQC.mjs src/data/sat/mockContent/batchMCanonicalTestKey.js src/data/sat/mockContent/batchMControlledReplacementMap.js src/data/sat/mockContent/batchMControlledReplacementMapAdapter.js src/data/sat/mockContent/batchMProductionStore.js
          git diff --cached --quiet || git commit -m "feat: apply authorized Batch M controlled replacement"
          git push
